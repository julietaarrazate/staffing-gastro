# DATABASE_URL se setea a mano con la connection string de Neon (sync=false),
# igual que Andamio (ekp-app) y Cuadra. NO se usa una base gestionada por
# Render: la de Render (plan free) vence y el blueprint la pisaba en cada
# deploy. La base real es la de Neon (postgresql+asyncpg://...?ssl=require),
# cargada en el dashboard de Render y NUNCA sobrescrita por este archivo.
services:
  - type: web
    name: staffya-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # Región FIJADA a propósito (2026-07-27). Sin esta línea Render usa Oregon
    # (US West) por default, y con la base en Neon São Paulo cada consulta
    # cruzaba el continente: ~180 ms de ida y vuelta POR CONSULTA, más el
    # `SELECT 1` de `pool_pre_ping` (ver #97) antes de cada request. Eso era
    # 1-2 s de espera pura de red por pantalla, con una sola usuaria y el
    # servidor despierto — el síntoma de "la app está lenta".
    #
    # `virginia` (US East) es la región de Render más cercana a Sudamérica y
    # la que se empareja con la base: Neon DEBE estar en `AWS US East
    # (N. Virginia)` para que backend y base queden en el mismo datacenter
    # (~2 ms en vez de ~180 ms).
    #
    # OJO: Render NO permite cambiar la región de un servicio ya creado. Para
    # mover uno existente hay que borrarlo y recrearlo con el MISMO nombre
    # (así conserva la URL staffya-backend.onrender.com, que el frontend usa
    # como default en `frontend/lib/api.ts` y para la CSP en `next.config.ts`).
    region: virginia
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Neon connection string — se setea manual en el dashboard
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: https://staffing-gastro.vercel.app
      # Siembra cuentas/comercios/turnos demo en el arranque (idempotente).
      # OJO: con la base real de Neon, esto siembra datos demo en producción.
      # Apagar (poner "false" o quitar) ANTES de onboardear comercios reales.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SENTRY_DSN
        sync: false
    autoDeploy: true
