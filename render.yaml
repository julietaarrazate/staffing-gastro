databases:
  - name: staffya-db
    plan: free
    databaseName: staffya
    user: staffya

services:
  - type: web
    name: staffya-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: staffya-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: https://staffing-gastro.vercel.app
      # Siembra cuentas/comercios/turnos demo en el arranque (idempotente).
      # Permite probar la app sin registrarse, con datos realistas.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SENTRY_DSN
        sync: false
    autoDeploy: true
