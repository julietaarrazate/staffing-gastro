# DATABASE_URL se setea a mano con la connection string de Neon (sync=false),
# igual que Andamio (ekp-app) y Cuadra. NO se usa una base gestionada por
# Render: la de Render (plan free) vence y el blueprint la pisaba en cada
# deploy. La base real es la de Neon (postgresql+asyncpg://...?ssl=require),
# cargada en el dashboard de Render y NUNCA sobrescrita por este archivo.
services:
  - type: web
    name: staffya-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # Región FIJADA a propósito (2026-07-27). Sin esta línea Render usa Oregon
    # (US West) por default, y con la base en Neon São Paulo cada consulta
    # cruzaba el continente: ~180 ms de ida y vuelta POR CONSULTA, más el
    # `SELECT 1` de `pool_pre_ping` (ver #97) antes de cada request. Eso era
    # 1-2 s de espera pura de red por pantalla, con una sola usuaria y el
    # servidor despierto — el síntoma de "la app está lenta".
    #
    # `ohio` (US East) empareja con la base: el proyecto Neon `staffya-us-east`
    # vive en `aws-us-east-2` (Ohio), así que backend y base quedan en la misma
    # región (~2 ms en vez de ~180 ms).
    #
    # OJO: Render NO permite cambiar la región de un servicio ya creado. Para
    # mover uno existente hay que borrarlo y recrearlo con el MISMO nombre
    # (así conserva la URL staffya-backend.onrender.com, que el frontend usa
    # como default en `frontend/lib/api.ts` y para la CSP en `next.config.ts`).
    region: ohio
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Neon connection string — se setea manual en el dashboard
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # oido.com.ar/www agregados de antemano (2026-09, dominio comprado en
      # NIC.ar, DNS todavía sin propagar) — agregar un origen no rompe nada
      # mientras el dominio no resuelva; así ya queda listo apenas Julieta
      # cargue los registros DNS, sin depender de otro deploy después.
      - key: CORS_ORIGINS
        value: https://staffing-gastro.vercel.app,https://oido.com.ar,https://www.oido.com.ar
      # Siembra cuentas/comercios/turnos demo en el arranque (idempotente, y
      # desde 2026-09-22 repone los turnos demo que ya pasaron).
      # OJO: con la base real de Neon, esto siembra datos demo en producción.
      # PRENDIDO (2026-09-23, decisión de Julieta): sin usuarios reales, la app
      # se ve poblada. Se fija ACÁ y no sólo en el dashboard porque un valor
      # declarado en este archivo pisa al del dashboard en cada deploy: Julieta
      # lo puso en true en el panel y la siembra no corrió (0 cuentas demo en
      # Neon después del deploy). ANTES DE LA BETA CON GENTE REAL: volver a
      # "false" ACÁ y purgar las cuentas demo (runbook "apagar el modo demo" en
      # docs/reference/DEPLOY.md) — tienen contraseña pública.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SENTRY_DSN
        sync: false
      # --- Email transaccional (Resend) ---
      # SIN ESTA CLAVE NO SE ENVÍA NINGÚN EMAIL. El backend cae a
      # `NullEmailSender`, que sólo loguea y nunca falla — por diseño, para
      # que un problema de email jamás rompa un registro o una asignación de
      # turno. El efecto secundario es que "recuperar contraseña" responde
      # OK ("si el mail existe, te enviamos un enlace") y no llega nada
      # (reporte real de Julieta, 2026-08-17). Se declara acá con
      # `sync: false` para que el slot exista y se complete en el dashboard
      # de Render; ver el runbook "Prender el email transaccional" en
      # docs/reference/DEPLOY.md.
      - key: RESEND_API_KEY
        sync: false
      # Remitente. El default del código es `onboarding@resend.dev`, el
      # dominio de PRUEBA de Resend, que sólo entrega a la casilla dueña de
      # la cuenta — para poder escribirle a cualquier usuario hay que
      # verificar un dominio propio en Resend y poner acá algo como
      # "Oído <hola@tudominio.com>".
      - key: EMAIL_FROM
        sync: false
      # --- Interpretación por IA (Gemini) ---
      # Sin esta clave, `POST /shifts/parse-text` y los dos asistentes
      # responden 503 y la app cae a "completá los datos a mano". Se declara
      # acá con `sync: false` para que el slot exista en el blueprint (antes
      # sólo vivía en el dashboard, invisible desde el repo — ver
      # docs/reference/DEPLOY.md).
      #
      # OJO con el MODELO, no sólo con la clave. Google ya dio de baja
      # `gemini-2.5-flash` una vez y rompió esta feature en producción
      # (docs/STATUS.md 2026-08-11). Si el asistente contesta "no pudimos
      # interpretar el texto" con la clave puesta, mirar los logs:
      # `_call_gemini` loguea el modelo usado y el cuerpo del error de
      # Google, que dice si es cuota agotada o modelo dado de baja.
      - key: GEMINI_API_KEY
        sync: false
      # Vacío = el default del código (`gemini-3.5-flash`, ver
      # `app/core/config.py`). Se setea a mano sólo para migrar de modelo
      # cuando Google da de baja el vigente o lo saca del plan gratis: antes
      # eso exigía un deploy con cambio de código porque el modelo estaba
      # fijo dentro de la URL. `sync: false` para que un redeploy del
      # blueprint no pise lo que el operador puso en medio de un incidente.
      - key: GEMINI_MODEL
        sync: false
    autoDeploy: true
