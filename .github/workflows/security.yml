# Gate de seguridad automatizado (DUE_DILIGENCE_REPORT.md C4): antes de esto
# no había secret scanning ni dependency scanning en CI — un CVE nuevo o un
# secreto commiteado por error sólo se detectaba si alguien lo buscaba a
# mano. Ya pasó una vez: `backend/.venv-audit/` (82MB, venv completo)
# estuvo trackeado en git 3 semanas hasta que una auditoría manual lo
# encontró. Corre en cada PR y push a main, sin filtrar por área tocada
# (a diferencia de ci.yml) — un secreto o una dependencia vulnerable puede
# venir de cualquier lado.
name: Security

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Escanear historial completo
        run: ./gitleaks detect --source . --log-opts="--all" --redact -v

  backend-dependency-audit:
    name: Backend dependency audit (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Actualizar pip/setuptools del venv
        # setuptools/pip vienen bundleados con el venv (no están en
        # requirements.txt — no son dependencias de la app) pero pip-audit
        # los audita igual por default. El runner trae setuptools 79.0.1
        # con un CVE conocido (PYSEC-2026-3447); esto es sólo el toolchain
        # de build de CI, no algo que se despliegue.
        run: pip install --upgrade pip setuptools
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit

  frontend-dependency-audit:
    name: Frontend dependency audit (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high
