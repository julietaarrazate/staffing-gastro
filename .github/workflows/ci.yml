# CI de Staffya: los mismos gates que exige CLAUDE.md, ahora obligatorios en
# cada PR y push a main (el deploy a Render/Vercel es automático desde main,
# así que nada entra sin pasar por acá). Ver docs/reference/TESTING.md y ROADMAP R0.3.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (Vitest, T2) exige Node ^22.22.2 || ^24.15.0 || >=26 —
          # Node 20 rompe en runtime ("webidl.util.markAsUncloneable is not
          # a function", dependencia interna undici de jsdom).
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests unitarios
        run: npm run test:unit
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # misma versión que el job frontend (jsdom 30)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Tests E2E
        env:
          CI: "true"
        run: npm run test:e2e
      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
