# CI de Staffya: los mismos gates que exige CLAUDE.md, ahora obligatorios en
# cada PR y push a main (el deploy a Render/Vercel es automático desde main,
# así que nada entra sin pasar por acá). Ver docs/reference/TESTING.md y ROADMAP R0.3.
name: CI

# `push` incluye las ramas de trabajo, no sólo `main` (2026-09-16). El motivo
# es concreto: un PR abierto desde la API con el token de una GitHub App NO
# dispara workflows —GitHub lo evita a propósito, para que un workflow no se
# dispare a sí mismo en cadena—, así que un PR abierto por el asistente se
# quedaba sin CI y la única señal era una corrida local que no queda
# registrada en el PR. Escuchar el `push` saca ese problema de encima: el
# push lleva la identidad de quien empuja, no la de la App, y no depende de
# quién abrió el PR.
#
# `workflow_dispatch` es la otra mitad: permite relanzar CI a mano (o por API)
# sin tener que inventar un commit vacío para "despertarla", que es
# exactamente el atajo que no queremos.
on:
  pull_request:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  # Detecta qué área cambió para no correr los 3 jobs completos en cada push
  # — sin esto, una PR que sólo toca docs/frontend igual pagaba el pytest
  # completo (y viceversa), gasto real de minutos de CI sin ninguna señal
  # nueva que aportar. `.github/workflows/ci.yml` cuenta como cambio de
  # ambas áreas a propósito: un cambio al workflow se valida completo.
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    # dorny/paths-filter necesita listar los archivos del PR vía la API de
    # GitHub (el checkout por default es shallow, sin historia para un diff
    # local) — sin este permiso explícito falla con "Resource not accessible
    # by integration" (el GITHUB_TOKEN por default de este repo es read-only).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # En un disparo MANUAL se corre todo, sin filtrar: quien lo lanza quiere
      # una validación completa, y un filtro que no encuentre cambios dejaría
      # una CI verde que en realidad no ejecutó nada — el peor resultado
      # posible, porque miente.
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Contra qué se compara para saber qué cambió:
          #   · en un PR y en un push a `main`, el default de la acción
          #     (la base del PR / el commit anterior) es el correcto;
          #   · en un push a una rama de trabajo hay que decirle `main`
          #     explícitamente, porque en el PRIMER push de una rama nueva no
          #     existe un "commit anterior" contra el cual diffear.
          base: ${{ (github.event_name == 'pull_request' || github.ref_name == 'main') && '' || 'main' }}
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (tsc + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (Vitest, T2) exige Node ^22.22.2 || ^24.15.0 || >=26 —
          # Node 20 rompe en runtime ("webidl.util.markAsUncloneable is not
          # a function", dependencia interna undici de jsdom).
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests unitarios
        run: npm run test:unit
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # misma versión que el job frontend (jsdom 30)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Tests E2E
        env:
          CI: "true"
        run: npm run test:e2e
      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
