services:
  # Postgres liso, no postgis/postgis: el código no usa PostGIS (las
  # coordenadas son columnas float planas, distancia calculada en Python,
  # ver AUDIT/01_INVENTORY.md §7 y docs/reference/DATABASE.md). PostGIS sigue
  # "previsto, no adoptado" — si algún día se adopta, es un ADR y ahí se
  # vuelve a cambiar esta imagen.
  db:
    image: postgres:16-alpine
    container_name: staffya-db
    environment:
      POSTGRES_USER: staffya
      POSTGRES_PASSWORD: staffya
      POSTGRES_DB: staffya
    ports:
      - "5432:5432"
    volumes:
      - staffya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffya"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: staffya-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://staffya:staffya@db:5432/staffya
      JWT_SECRET_KEY: dev-secret-change-me
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  staffya_pgdata:
