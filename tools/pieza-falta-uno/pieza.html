<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Falta uno</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body><canvas id="lienzo"></canvas>
<script type="module">
import { crearMotor } from './src/motor.js';
import { crearLetras } from './src/letras.js';
const q = new URLSearchParams(location.search), W = +(q.get('w') || 720), H = +(q.get('h') || 1280), cual = q.get('escena') || '3';
const fuentes = [['Mansalva', './fuentes/mansalva.woff2'], ['Young Serif', '../teaser-futuro-gastronomia/fuentes/young-serif.woff2']];
for (const [n, u] of fuentes) { const f = new FontFace(n, `url(${u})`); await f.load(); document.fonts.add(f); }
const lienzo = document.getElementById('lienzo'); lienzo.width = W; lienzo.height = H;
const motor = crearMotor(lienzo, W, H);
const { crearEscena3 } = await import('./src/escena' + cual + '.js');
const escena = await crearEscena3(motor);
const letras = crearLetras(W, H, 'Young Serif');
window.pieza = {
  escena,
  cuadro(t, { sub } = {}) {
    const tex = letras.dibujar(escena.letras(t));
    motor.cuadro(escena, t, { sub: sub ?? escena.subcuadros(t), obtur: 1 / 60, texto: tex });
    return lienzo.toDataURL('image/jpeg', 0.96);
  },
};
window.listo = true;
</script></body></html>
